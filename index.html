<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#fcfaf7"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Yallah"><link rel="apple-touch-icon" href="img/icon.png"><link rel="icon" href="img/icon.png"><title>Yallah Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<style>
/* Phones get the app full screen; laptops see it in a plain phone frame beside a short journey menu. */
:root {
  --page: #f3efe8; --page-ink: #1b1a17; --page-muted: #6d675d; --page-line: #e3dccf; --page-card: #fffdf9;
  --app-bg: #fcfaf7; --card: #ffffff; --ink: #17171a; --muted: #747882; --faint: #a3a7ae; --line: #efebe5;
  --gold: #f5b82e; --gold-soft: #fdf0cf; --gold-deep: #8a6408; --chip: #f4f1ec; --red: #c4382f; --green: #2f8a57;
  --sans: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", Inter, "Segoe UI", Roboto, sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --page: #15130f; --page-ink: #f3efe7; --page-muted: #a9a294; --page-line: #2e2a22; --page-card: #1d1a15; color-scheme: dark } }
:root[data-theme="dark"] { --page: #15130f; --page-ink: #f3efe7; --page-muted: #a9a294; --page-line: #2e2a22; --page-card: #1d1a15; color-scheme: dark }
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; }
body { margin: 0; background: var(--page); color: var(--page-ink); font-family: var(--sans); -webkit-font-smoothing: antialiased; overscroll-behavior: none; }
button, input { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }

/* ---------- shell ---------- */
.stage { height: 100%; display: grid; grid-template-columns: minmax(250px, 300px) auto; justify-content: center; align-items: center; gap: 64px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 24px; }
.rail { display: flex; flex-direction: column; gap: 16px; max-height: calc(100vh - 48px); min-height: 0; }
.rail img { width: 120px; }
.rail h1 { margin: 0; font-size: 26px; font-weight: 800; letter-spacing: -0.03em; line-height: 1.15; }
.rail h1 em { font-style: normal; color: var(--gold); }
.rail p { margin: 0; color: var(--page-muted); font-size: 14px; line-height: 1.5; }
.jlist { display: flex; flex-direction: column; overflow-y: auto; min-height: 0; border-top: 1px solid var(--page-line); }
.jlist button { display: flex; align-items: center; gap: 12px; padding: 10px 4px; background: none; border: 0; border-bottom: 1px solid var(--page-line); text-align: left; cursor: pointer; font-weight: 600; font-size: 14px; color: var(--page-ink); }
.jlist button svg { width: 20px; height: 20px; color: var(--page-muted); }
.jlist button:hover svg { color: var(--gold); }
.railfoot { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.pill { border: 1px solid var(--page-line); background: var(--page-card); color: var(--page-ink); padding: 8px 14px; border-radius: 999px; font-size: 13px; font-weight: 700; cursor: pointer; }
.seg { display: inline-flex; border: 1px solid var(--page-line); background: var(--page-card); border-radius: 999px; padding: 3px; }
.seg button { border: 0; background: none; padding: 6px 12px; border-radius: 999px; font-size: 12.5px; font-weight: 800; cursor: pointer; color: var(--page-muted); }
.seg button[aria-pressed="true"] { background: var(--gold); color: #261900; }

.device { width: calc(414px * var(--s, 1)); height: calc(868px * var(--s, 1)); position: relative; }
.bezel { position: absolute; left: 0; top: 0; width: 414px; height: 868px; transform: scale(var(--s, 1)); transform-origin: 0 0; background: #121212; border-radius: 58px; padding: 12px; box-shadow: 0 30px 70px -24px rgba(50, 35, 0, .4); }
#app { position: relative; width: 390px; height: 844px; border-radius: 46px; overflow: hidden; background: var(--app-bg); color: var(--ink); font-family: var(--sans); --top: 26px; --bot: 22px; }
.handle, .backdrop { display: none; }
@media (max-width: 760px), (max-height: 600px) and (pointer: coarse) {
  .stage { display: block; padding: 0; }
  .rail { display: none; }
  .device { position: fixed; inset: 0; width: auto; height: auto; }
  .bezel { position: static; transform: none; width: 100%; height: 100%; padding: 0; border-radius: 0; box-shadow: none; background: var(--app-bg); }
  #app { width: 100%; height: 100%; border-radius: 0; --top: max(14px, env(safe-area-inset-top, 0px)); --bot: max(12px, env(safe-area-inset-bottom, 0px)); }
  .handle { display: block; position: fixed; z-index: 60; right: env(safe-area-inset-right, 0px); top: 38%; width: 12px; height: 44px; border-radius: 8px 0 0 8px; border: 0; background: rgba(23, 23, 26, .16); cursor: pointer; padding: 0; }
  .backdrop.show { display: block; position: fixed; inset: 0; z-index: 70; background: rgba(10, 8, 4, .45); }
  .rail.sheet { display: flex; position: fixed; z-index: 80; left: 0; right: 0; bottom: 0; max-height: 86vh; background: var(--page-card); border-radius: 24px 24px 0 0;
    padding: 20px max(18px, env(safe-area-inset-right, 0px)) calc(18px + env(safe-area-inset-bottom, 0px)) max(18px, env(safe-area-inset-left, 0px)); }
}
/* tablets in full-screen mode: keep the app a comfortable phone width, centred */
@media (max-width: 760px) and (min-width: 600px) { #app { max-width: 560px; margin: 0 auto; box-shadow: 0 0 0 1px var(--line); } }

/* ---------- app ---------- */
.scr { position: absolute; inset: 0; display: flex; flex-direction: column; background: var(--app-bg); animation: enter .22s ease-out; }
@keyframes enter { from { opacity: 0; transform: translateX(14px); } to { opacity: 1; transform: none; } }
.scr.fade { animation: fadein .35s ease-out; }
@keyframes fadein { from { opacity: 0; } to { opacity: 1; } }
.top { padding: calc(var(--top) + 6px) 20px 10px; display: flex; align-items: center; gap: 12px; position: relative; z-index: 3; }
.top .t { font-size: 19px; font-weight: 800; letter-spacing: -0.02em; flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.body { flex: 1; min-height: 0; overflow-y: auto; padding: 4px 22px 20px; display: flex; flex-direction: column; gap: 18px; scrollbar-width: none; position: relative; }
.body::-webkit-scrollbar { display: none; }
.foot { padding: 10px 22px calc(var(--bot) + 6px); display: flex; flex-direction: column; gap: 8px; }
.foot:has(+ .nav) { padding-bottom: 10px; }
.nav { display: flex; padding: 8px 14px calc(var(--bot) - 4px); background: var(--card); border-top: 1px solid var(--line); }
.nav button { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px; border: 0; background: none; font-size: 11px; font-weight: 600; color: var(--faint); cursor: pointer; padding: 4px 0; }
.nav button.on { color: var(--ink); }
.nav button.on .ic { color: var(--gold-deep); }
.nav button.on::after { content: ""; width: 4px; height: 4px; border-radius: 50%; background: var(--gold); }

.ic { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.round { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; background: var(--card); border: 1px solid var(--line); flex: none; cursor: pointer; padding: 0; color: var(--ink); }
.av { width: 48px; height: 48px; border-radius: 50%; display: grid; place-items: center; background: #ece5d8; font-weight: 800; flex: none; }
.h1 { font-size: 30px; font-weight: 800; letter-spacing: -0.03em; line-height: 1.12; margin: 0; text-wrap: balance; }
.h2 { font-size: 22px; font-weight: 800; letter-spacing: -0.025em; margin: 0; }
.h3 { font-size: 15px; font-weight: 700; margin: 0; letter-spacing: -0.01em; }
.sub { color: var(--muted); font-size: 15px; line-height: 1.5; margin: 0; }
.small { font-size: 12.5px; color: var(--muted); }
.label { font-size: 12px; font-weight: 700; color: var(--muted); letter-spacing: .02em; }
.gold { color: var(--gold); }
.num { font-variant-numeric: tabular-nums; }
.center { text-align: center; align-items: center; }
.btn { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; min-height: 56px; border-radius: 18px; border: 0; background: var(--gold); color: #1d1500; font-weight: 700; font-size: 16px; cursor: pointer; }
.btn.dark { background: var(--ink); color: #fff; }
.btn.ghost { background: var(--chip); color: var(--ink); }
.btn.white { background: #fff; color: var(--ink); }
.btn.sm { min-height: 48px; font-size: 15px; }
.link { background: none; border: 0; color: var(--muted); font-weight: 600; font-size: 14px; cursor: pointer; padding: 10px; align-self: center; }
.link.red { color: var(--red); }
.field { display: flex; align-items: center; gap: 12px; min-height: 56px; border-radius: 18px; background: var(--card); border: 1.5px solid var(--line); padding: 0 16px; font-size: 16px; width: 100%; text-align: left; cursor: pointer; color: var(--ink); }
.field.on { border-color: var(--gold); box-shadow: 0 0 0 4px var(--gold-soft); }
.field .ph { color: var(--muted); }
.fl { display: flex; flex-direction: column; gap: 6px; }
.row { display: flex; align-items: center; gap: 14px; }
.grow { flex: 1; min-width: 0; }
.list { display: flex; flex-direction: column; }
.li { display: flex; align-items: center; gap: 14px; padding: 14px 0; border: 0; border-bottom: 1px solid var(--line); background: none; text-align: left; width: 100%; cursor: pointer; color: var(--ink); }
.li:last-child { border-bottom: 0; }
.li.static { cursor: default; }
.tile { width: 42px; height: 42px; border-radius: 14px; background: var(--chip); display: grid; place-items: center; color: var(--ink); flex: none; }
.tile.gold { background: var(--gold-soft); color: var(--gold-deep); }
.tile.solid { background: var(--gold); color: #1d1500; }
.chev { color: var(--faint); }
.card { background: var(--card); border-radius: 22px; box-shadow: 0 0 0 1px var(--line) inset; padding: 16px; }
button.card { border: 0; cursor: pointer; text-align: left; color: var(--ink); width: 100%; }
.soft { background: var(--chip); border-radius: 20px; padding: 14px 16px; }
.chips { display: flex; gap: 8px; flex-wrap: wrap; }
.chip { padding: 9px 14px; border-radius: 999px; background: var(--chip); font-size: 13.5px; font-weight: 600; border: 0; cursor: pointer; color: var(--ink); }
.chip.on { background: var(--ink); color: #fff; }
.chip.static { cursor: default; }
.glow { position: absolute; border-radius: 50%; pointer-events: none; background: radial-gradient(closest-side, rgba(245, 184, 46, .30), rgba(245, 184, 46, .1) 55%, rgba(245, 184, 46, 0)); z-index: 0; }
.rel { position: relative; z-index: 1; }
.kv { display: flex; flex-direction: column; }
.kv div { display: flex; justify-content: space-between; gap: 12px; padding: 11px 0; border-bottom: 1px solid var(--line); font-size: 14.5px; }
.kv div:last-child { border-bottom: 0; }
.kv span { color: var(--muted); }
.kv b { text-align: right; font-weight: 700; }

/* home grid: 4 columns */
.svc4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px 8px; }
.svc4 button { border: 0; background: none; display: flex; flex-direction: column; align-items: center; gap: 8px; cursor: pointer; font-size: 12px; font-weight: 600; color: var(--ink); padding: 0; min-width: 0; }
.svc4 .sq { width: 100%; max-width: 68px; aspect-ratio: 1; border-radius: 20px; background: var(--card); box-shadow: 0 0 0 1px var(--line) inset; display: grid; place-items: center; }
.svc4 .sq .ic { width: 26px; height: 26px; stroke-width: 1.5; }
.svc4 button.hot .sq { background: var(--gold); box-shadow: none; color: #1d1500; }
.svc4 span.n { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
.balance { display: flex; align-items: center; gap: 12px; background: var(--ink); color: #fff; border-radius: 22px; padding: 16px 18px; }
.balance .mini { border: 0; background: var(--gold); color: #1d1500; border-radius: 14px; min-height: 42px; padding: 0 14px; font-weight: 700; display: flex; gap: 6px; align-items: center; cursor: pointer; }
.banner { position: relative; height: 150px; border-radius: 22px; overflow: hidden; border: 0; padding: 0; cursor: pointer; width: 100%; text-align: left; flex: none; }
.banner img, .banner svg.ph { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.banner .cap { position: absolute; left: 0; right: 0; bottom: 0; padding: 40px 16px 14px; background: linear-gradient(transparent, rgba(0, 0, 0, .7)); color: #fff; }

/* photo pages */
.photo { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.shade { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(0,0,0,.35) 0%, rgba(0,0,0,0) 28%, rgba(0,0,0,0) 45%, rgba(0,0,0,.78) 82%, rgba(0,0,0,.88) 100%); }
.on-photo { color: #fff; }
.on-photo .sub { color: rgba(255,255,255,.82); }
.dots { display: flex; gap: 6px; }
.dots i { width: 7px; height: 7px; border-radius: 4px; background: rgba(255,255,255,.4); transition: width .2s; }
.dots i.on { width: 22px; background: var(--gold); }
.glass { background: rgba(255,255,255,.14); border: 1px solid rgba(255,255,255,.25); color: #fff; backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }

/* maps + sheets */
.map { position: absolute; inset: 0; width: 100%; height: 100%; }
.floattop { position: absolute; left: 0; right: 0; top: 0; padding: calc(var(--top) + 6px) 20px 0; display: flex; justify-content: space-between; align-items: center; gap: 10px; z-index: 3; }
.sheet { position: absolute; left: 0; right: 0; bottom: 0; background: var(--card); border-radius: 28px 28px 0 0; box-shadow: 0 -12px 40px rgba(30, 20, 0, .08); padding: 12px 22px calc(var(--bot) + 8px); z-index: 4; display: flex; flex-direction: column; gap: 12px; max-height: 78%; overflow-y: auto; scrollbar-width: none; }
.grab { width: 40px; height: 4px; border-radius: 2px; background: var(--line); margin: 0 auto 4px; flex: none; }
.opt { display: flex; align-items: center; gap: 14px; padding: 11px 14px; border-radius: 18px; border: 1.5px solid transparent; background: none; width: 100%; text-align: left; cursor: pointer; color: var(--ink); }
.opt.on { border-color: var(--gold); background: #fffbf1; }
.opt.on .tile { background: var(--gold); color: #1d1500; }
.centerpin { position: absolute; left: 50%; top: 40%; transform: translate(-50%, -100%); z-index: 2; display: flex; flex-direction: column; align-items: center; pointer-events: none; }
.centerpin .p { width: 46px; height: 46px; border-radius: 50% 50% 50% 4px; transform: rotate(-45deg); background: var(--ink); display: grid; place-items: center; }
.centerpin .p i { width: 14px; height: 14px; border-radius: 50%; background: var(--gold); }
.centerpin b { width: 10px; height: 4px; border-radius: 50%; background: rgba(0,0,0,.25); margin-top: 6px; }
.pulse { position: absolute; border-radius: 50%; border: 1.5px solid rgba(245, 184, 46, .6); animation: ping 2.4s ease-out infinite; }
@keyframes ping { from { transform: scale(.4); opacity: 1; } to { transform: scale(1.6); opacity: 0; } }
.bar { height: 4px; border-radius: 2px; background: var(--chip); overflow: hidden; flex: none; }
.bar i { display: block; height: 100%; width: 40%; background: var(--gold); border-radius: 2px; animation: slide 1.6s ease-in-out infinite; }
.bar.fill i { width: 100%; transform-origin: left; animation: fill var(--dur, 5s) linear forwards; }
@keyframes slide { from { transform: translateX(-100%); } to { transform: translateX(260%); } }
@keyframes fill { from { transform: scaleX(0); } to { transform: scaleX(1); } }
.spinner { width: 64px; height: 64px; border-radius: 50%; display: grid; place-items: center; border: 1px solid rgba(245, 184, 46, .45); background: radial-gradient(circle, #fff 55%, var(--gold-soft)); }
.spinner i { width: 40px; height: 40px; border-radius: 50%; border: 3px solid rgba(245, 184, 46, .25); border-top-color: var(--gold); animation: spin 1.1s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.okmark { width: 80px; height: 80px; border-radius: 50%; background: var(--gold); display: grid; place-items: center; color: #1d1500; animation: pop .35s ease-out; }
.okmark.bad { background: #fbe3e1; color: var(--red); }
.okmark.grey { background: var(--chip); color: var(--muted); }
.okmark .ic { width: 38px; height: 38px; stroke-width: 2.2; }
@keyframes pop { from { transform: scale(.6); opacity: 0; } to { transform: scale(1); opacity: 1; } }
.stars { display: flex; gap: 10px; justify-content: center; }
.stars button { border: 0; background: none; padding: 0; cursor: pointer; }
.stars svg { width: 36px; height: 36px; }
.steps { display: flex; flex-direction: column; }
.step { display: flex; gap: 14px; align-items: flex-start; padding-bottom: 18px; position: relative; }
.step::before { content: ""; position: absolute; left: 11px; top: 26px; bottom: 2px; width: 2px; background: var(--line); }
.step:last-child { padding-bottom: 0; }
.step:last-child::before { display: none; }
.step .d { width: 24px; height: 24px; border-radius: 50%; border: 2px solid var(--line); background: var(--card); flex: none; display: grid; place-items: center; }
.step.done .d { background: var(--gold); border-color: var(--gold); color: #1d1500; }
.step.done .d .ic { width: 14px; height: 14px; stroke-width: 3; }
.step.now .d { border-color: var(--gold); box-shadow: 0 0 0 5px var(--gold-soft); }
.step.now .d::after { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--gold); }
.step .h3 { margin-top: 2px; }
.step:not(.done):not(.now) .h3 { color: var(--faint); font-weight: 600; }
.food { border-radius: 22px; overflow: hidden; background: var(--card); box-shadow: 0 0 0 1px var(--line) inset; border: 0; padding: 0; text-align: left; cursor: pointer; color: var(--ink); width: 100%; flex: none; }
.food .art { height: 116px; position: relative; overflow: hidden; }
.food .meta { padding: 12px 14px 14px; display: flex; flex-direction: column; gap: 3px; }
.qty { display: flex; align-items: center; gap: 10px; }
.qty button { width: 32px; height: 32px; border-radius: 50%; border: 1px solid var(--line); background: var(--card); display: grid; place-items: center; cursor: pointer; padding: 0; }
.qty button.add { background: var(--gold); border-color: var(--gold); color: #1d1500; }
.qty .ic { width: 16px; height: 16px; stroke-width: 2.2; }
.cartbar { display: flex; align-items: center; gap: 12px; background: var(--ink); color: #fff; border-radius: 18px; min-height: 58px; padding: 0 18px; border: 0; cursor: pointer; width: 100%; font-weight: 700; font-size: 15px; }
.cartbar .n { width: 26px; height: 26px; border-radius: 50%; background: var(--gold); color: #1d1500; display: grid; place-items: center; font-size: 13px; }
.seats { display: grid; grid-template-columns: repeat(2, 44px) 24px repeat(2, 44px); gap: 10px; justify-content: center; }
.seat { width: 44px; height: 44px; border-radius: 12px; border: 1.5px solid var(--line); background: var(--card); font-size: 12px; font-weight: 700; color: var(--muted); cursor: pointer; padding: 0; }
.seat.taken { background: var(--chip); border-color: var(--chip); color: var(--faint); cursor: default; }
.seat.on { background: var(--gold); border-color: var(--gold); color: #1d1500; }
.keypad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.keypad button { min-height: 56px; border: 0; background: none; font-size: 24px; font-weight: 600; border-radius: 16px; cursor: pointer; color: var(--ink); }
.keypad button:active { background: var(--chip); }
.pins { display: flex; gap: 14px; justify-content: center; }
.pins i { width: 16px; height: 16px; border-radius: 50%; border: 2px solid var(--faint); }
.pins i.on { background: var(--ink); border-color: var(--ink); }
.otp { display: flex; gap: 12px; }
.otp span { flex: 1; height: 62px; border-radius: 16px; background: var(--card); border: 1.5px solid var(--line); display: grid; place-items: center; font-size: 24px; font-weight: 800; }
.otp span.on { border-color: var(--gold); box-shadow: 0 0 0 4px var(--gold-soft); }
.bubble { max-width: 78%; padding: 11px 14px; border-radius: 18px; font-size: 14.5px; line-height: 1.4; }
.bubble.me { align-self: flex-end; background: var(--gold); color: #1d1500; border-bottom-right-radius: 6px; }
.bubble.them { align-self: flex-start; background: var(--chip); border-bottom-left-radius: 6px; }
.toggle { width: 46px; height: 28px; border-radius: 14px; background: var(--chip); border: 0; position: relative; cursor: pointer; flex: none; padding: 0; }
.toggle::after { content: ""; position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0, 0, 0, .2); transition: left .15s; }
.toggle.on { background: var(--gold); }
.toggle.on::after { left: 21px; }
.radio { width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--line); flex: none; }
.radio.on { border: 7px solid var(--gold); }
.amount { font-size: 42px; font-weight: 800; letter-spacing: -0.03em; text-align: center; }
.dash { border: 1.5px dashed var(--line); border-radius: 20px; padding: 14px 16px; }
.cal { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; text-align: center; font-size: 13.5px; }
.cal b { font-size: 11px; color: var(--faint); font-weight: 700; padding: 4px 0; }
.cal span { padding: 9px 0; border-radius: 12px; font-weight: 600; }
.cal span.in { background: var(--gold-soft); border-radius: 0; }
.cal span.edge { background: var(--gold); color: #1d1500; }
.cal span.off { color: var(--faint); }
.toast { position: absolute; left: 50%; bottom: 110px; transform: translateX(-50%); background: var(--ink); color: #fff; padding: 10px 16px; border-radius: 999px; font-size: 13px; font-weight: 600; z-index: 30; white-space: nowrap; animation: fadein .2s; }
.badge { display: inline-flex; align-items: center; gap: 4px; padding: 4px 10px; border-radius: 999px; font-size: 12px; font-weight: 700; background: var(--gold-soft); color: var(--gold-deep); }
.badge.grey { background: var(--chip); color: var(--muted); }
.badge.green { background: #e2f3e8; color: var(--green); }
@media (prefers-reduced-motion: reduce) { .scr, .pulse, .spinner i, .bar i, .okmark { animation: none !important; } .bar.fill i { transform: none; } }

S.empty = () => `<div class="scr">${header(L('Activité', 'Activity'))}<div class="body center" style="justify-content:center;gap:12px"><div class="okmark grey">${ic('clock')}</div><h1 class="h2" style="margin-top:8px">${L('Rien pour l\'instant', 'Nothing yet')}</h1><p class="sub">${L('Vos courses apparaîtront ici.', 'Your rides will show here.')}</p></div>
  <div class="foot"><button class="btn" data-go="dest" data-ride="taxi">${L('Réserver une course', 'Book a ride')}</button></div>${nav('activity')}</div>`;
S.update = () => state('mobile', L('Mise à jour disponible', 'Update available'), L('Installez la dernière version.', 'Install the latest version.'), L('Mettre à jour', 'Update'), 'home', '');

S.states = () => `<div class="scr">${header(L('Écrans d\'erreur', 'Error screens'))}<div class="body"><div class="list">${li('wifi', L('Pas de connexion', 'No connection'), null, 'offline')}${li('pin', L('Localisation désactivée', 'Location off'), null, 'locoff')}${li('car', L('Aucun chauffeur', 'No drivers'), null, 'nodriver')}${li('x', L('Paiement refusé', 'Payment declined'), null, 'payfail')}${li('clock', L('Liste vide', 'Empty list'), null, 'empty')}${li('mobile', L('Mise à jour', 'Update'), null, 'update')}</div></div>${nav('')}</div>`;
/* ---------- success ---------- */
const OKS = {
  cancel: { t: ['Course annulée', 'Ride cancelled'], s: ['Aucun frais', 'No fee'], b: 'home' },
  pool: { t: ['Place réservée', 'Seat booked'], s: ['Départ demain à 07:00', 'Leaves tomorrow at 07:00'], b: 'activity' },
  rental: { t: ['Réservation envoyée', 'Booking sent'], s: ['Confirmation sous 45 min', 'Confirmation within 45 min'], b: 'activity' },
  request: { t: ['Demande envoyée', 'Request sent'], s: ['Nous vous contactons sous 24 h', "We'll contact you within 24 h"], b: 'home' },
  airport: { t: ['Transfert réservé', 'Transfer booked'], s: ['Votre chauffeur suit votre vol', 'Your driver tracks your flight'], b: 'activity' },
  bookcancel: { t: ['Réservation annulée', 'Booking cancelled'], s: ['Remboursé sur Yallah Pay', 'Refunded to Yallah Pay'], b: 'activity' },
  food: { t: ['Bon appétit !', 'Enjoy your meal!'], s: ['Commande livrée à 13:52', 'Delivered at 13:52'], b: 'home', rate: true },
  topup: { t: ['Recharge réussie', 'Top-up successful'], s: null, b: 'wallet' },
  sent: { t: ['Argent envoyé', 'Money sent'], s: [`${cdf(25000)} à Mireille`, `${cdf(25000)} to Mireille`], b: 'wallet' }
};
function okGo(k) { st.ok = { ...OKS[k] }; if (k === 'topup') st.ok.s = [`+ ${cdf(st.amount)}`, `+ ${cdf(st.amount)}`]; return 'ok'; }
S.ok = () => { const o = st.ok || OKS.request;
  return `<div class="scr fade"><div class="glow" style="width:440px;height:360px;left:-25px;top:90px"></div><div class="body rel center" style="justify-content:center;gap:12px"><div class="okmark">${ic('check')}</div>
  <h1 class="h1" style="margin-top:10px">${L(o.t[0], o.t[1])}</h1>${o.s ? `<p class="sub">${L(o.s[0], o.s[1])}</p>` : ''}${o.rate ? `<div class="stars" style="margin-top:10px">${stars(st.rate)}</div>` : ''}</div>
  <div class="foot"><button class="btn" data-go="${o.b}" data-reset>${o.b === 'home' ? L('Retour à l\'accueil', 'Back to home') : o.b === 'wallet' ? L('Voir le portefeuille', 'View wallet') : L('Voir mon activité', 'View activity')}</button></div></div>`; };

/* ---------- router ---------- */
const app = document.getElementById('app');
function render(name, push = true) {
  if (!S[name]) return;
  clearTimeout(timer);
  if (push && current && current !== name) stack.push(current);
  current = name;
  const old = app.querySelector('.scr');
  app.insertAdjacentHTML('beforeend', S[name]());
  if (old) old.remove();
  const a = S[name].auto;
  if (a) timer = setTimeout(() => { if (current === name) render(typeof a[0] === 'function' ? a[0]() : a[0]); }, a[1]);
}
function refresh() { const sc = app.querySelector('.scr'); const y = sc && sc.querySelector('.body') ? sc.querySelector('.body').scrollTop : 0; app.insertAdjacentHTML('beforeend', S[current]()); sc && sc.remove(); const n = app.querySelector('.scr'); n.style.animation = 'none'; const nb = n.querySelector('.body'); if (nb) nb.scrollTop = y; }
function back() { clearTimeout(timer); const p = stack.pop(); render(p || 'home', false); }
function toast(msg) { const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg; app.appendChild(t); setTimeout(() => t.remove(), 1600); }

app.addEventListener('click', e => {
  const el = e.target.closest('[data-go],[data-back],[data-act]');
  if (!el || el.disabled) return;
  if (el.dataset.ride) st.ride = el.dataset.ride;
  if (el.dataset.car) st.car = el.dataset.car;
  if (el.dataset.chat) st.chatWith = el.dataset.chat;
  if (el.dataset.ok) okGo(el.dataset.ok);
  if (el.hasAttribute('data-back')) return back();
  if (el.dataset.go) {
    if (el.dataset.go === 'pin') st.pin = '';
    if (el.hasAttribute('data-reset')) stack = [];
    return render(el.dataset.go);
  }
  const v = el.dataset.v;
  switch (el.dataset.act) {
    case 'slide': st.slide = Math.min(st.slide + 1, 2); refresh(); break;
    case 'ride': st.ride = v; refresh(); break;
    case 'rate': st.rate = +v; refresh(); break;
    case 'tip': st.tip = +v; refresh(); break;
    case 'when': st.when = +v; refresh(); break;
    case 'pay': st.pay = v; refresh(); break;
    case 'promo': st.promo = true; refresh(); break;
    case 'poolday': st.poolDay = +v; refresh(); break;
    case 'size': st.size = v; refresh(); break;
    case 'veh': st.veh = v; refresh(); break;
    case 'cart': st.cart[v] = Math.max(0, (st.cart[v] || 0) + (+el.dataset.d)); if (!st.cart[v]) delete st.cart[v]; refresh(); break;
    case 'adddish': st.cart.poulet = (st.cart.poulet || 0) + 1; back(); break;
    case 'chauffeur': st.chauffeur = !st.chauffeur; refresh(); break;
    case 'notif': st.notif[v] = !st.notif[v]; refresh(); break;
    case 'tgl': el.classList.toggle('on'); break;
    case 'radio': el.parentElement.querySelectorAll('.radio').forEach(r => r.classList.toggle('on', el.contains(r))); break;
    case 'seat': st.seat = v; refresh(); break;
    case 'amount': st.amount = +v; refresh(); break;
    case 'method': st.method = v; refresh(); break;
    case 'payyallah': st.pay = 'yallah'; stack.pop(); render('order', false); break;
    case 'lang': setLang(v); break;
    case 'pick': el.parentElement.querySelectorAll('.chip').forEach(c => c.classList.toggle('on', c === el)); break;
    case 'toast': toast(v); break;
    case 'key': if (v === '⌫') st.pin = st.pin.slice(0, -1); else if (st.pin.length < 4) st.pin += v; refresh();
      if (st.pin.length === 4) setTimeout(() => render(okGo('sent')), 350); break;
  }
});
/* swipe between intro slides */
let sx = null;
app.addEventListener('touchstart', e => { if (current === 'intro') sx = e.touches[0].clientX; }, { passive: true });
app.addEventListener('touchend', e => { if (current !== 'intro' || sx === null) return; const dx = e.changedTouches[0].clientX - sx; sx = null; if (Math.abs(dx) < 50) return; st.slide = Math.max(0, Math.min(2, st.slide + (dx < 0 ? 1 : -1))); refresh(); });

/* ---------- shell ---------- */
const J = [
  ['splash', 'home', () => L('Démarrage', 'Start'), () => { st.slide = 0; }], ['home', 'grid', () => L('Accueil', 'Home')],
  ['dest', 'car', () => 'Taxi', () => { st.ride = 'taxi'; }], ['dest', 'moto', () => 'Moto', () => { st.ride = 'moto'; }], ['pool', 'pool', () => L('Covoiturage', 'Carpool')],
  ['parcel', 'box', () => L('Colis', 'Parcel')], ['food', 'food', () => L('Repas', 'Food')], ['rental', 'key', () => L('Location', 'Car rental')],
  ['bus', 'bus', () => 'Bus'], ['air1', 'plane', () => L('Aéroport', 'Airport')], ['school1', 'school', () => L('École', 'School')], ['biz1', 'building', () => L('Entreprise', 'Business')],
  ['wallet', 'wallet', () => L('Portefeuille', 'Wallet')], ['activity', 'clock', () => L('Activité', 'Activity')], ['profile', 'user', () => L('Profil', 'Profile')], ['states', 'wifi', () => L('Écrans d\'erreur', 'Error screens')]
];
function buildRail() {
  document.getElementById('jlist').innerHTML = J.map(([s, i, l], k) => `<button type="button" data-j="${k}">${ic(i)}<span>${l()}</span></button>`).join('');
  document.getElementById('railSub').textContent = L('Touchez l\'écran comme dans la vraie application.', 'Tap through it like the real app.');
  document.getElementById('restartL').textContent = L('Recommencer', 'Restart');
}
document.getElementById('jlist').addEventListener('click', e => { const b = e.target.closest('[data-j]'); if (!b) return; const j = J[+b.dataset.j]; if (j[3]) j[3](); stack = []; render(j[0]); closeSheet(); });
document.getElementById('restart').addEventListener('click', () => { stack = []; st.cart = {}; st.slide = 0; st.promo = false; render('splash'); closeSheet(); });
function setLang(l) { st.lang = l; document.documentElement.lang = l; document.querySelectorAll('[data-lang]').forEach(b => b.setAttribute('aria-pressed', b.dataset.lang === l)); buildRail(); if (current) refresh(); try { localStorage.setItem('yallah-lang', l); } catch (e) {} }
document.querySelectorAll('[data-lang]').forEach(b => b.addEventListener('click', () => setLang(b.dataset.lang)));
const rail = document.getElementById('rail'), bd = document.getElementById('backdrop');
function closeSheet() { rail.classList.remove('sheet'); bd.classList.remove('show'); }
document.getElementById('handle').addEventListener('click', () => { rail.classList.add('sheet'); bd.classList.add('show'); });
bd.addEventListener('click', closeSheet);
function fit() { const s = Math.min(1, (window.innerHeight - 48) / 868, (window.innerWidth - 420) / 414); document.getElementById('device').style.setProperty('--s', Math.max(0.55, s).toFixed(3)); }
window.addEventListener('resize', fit); fit();
try { const l = localStorage.getItem('yallah-lang'); if (l === 'en' || l === 'fr') st.lang = l; } catch (e) {}
setLang(st.lang);
const HASH = { taxi: ['dest', 'taxi'], moto: ['dest', 'moto'], carpool: ['pool'], parcel: ['parcel'], food: ['food'], rental: ['rental'], bus: ['bus'], airport: ['air1'], school: ['school1'], business: ['biz1'], wallet: ['wallet'], home: ['home'], profile: ['profile'] }[(location.hash || '').slice(1)];
if (HASH) { if (HASH[1]) st.ride = HASH[1]; render(HASH[0]); } else render('splash');
</script>

</body></html>
